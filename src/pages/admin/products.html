<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت محصولات | پنل مدیریت نِگار</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
  <link rel="stylesheet" href="../../../dist/css/style.css">
</head>

<body class="bg-bg text-text antialiased">

  <div class="admin-layout">

    <!-- سایدبار (کپی از index با تغییر is-active) -->
    <aside id="adminSidebar" class="admin-sidebar">
      <div class="admin-sidebar-brand">
        <a href="../../index.html" class="inline-flex items-center gap-2.5 text-white">
          <span class="grid h-10 w-10 place-items-center rounded-[13px] bg-accent text-xl text-ink"><i class="ri-book-3-line"></i></span>
          <span>
            <strong class="block text-[17px] font-black leading-none">نِگار</strong>
            <small class="mt-1 block text-[8px] font-semibold text-white/60">پنل مدیریت</small>
          </span>
        </a>
        <button class="icon-btn !bg-white/5 !border-white/10 !text-white lg:hidden" data-admin-close>
          <i class="ri-close-line"></i>
        </button>
      </div>

      <nav class="admin-nav">
        <p class="admin-nav-title">اصلی</p>
        <a href="./index.html" class="admin-nav-item"><i class="ri-dashboard-3-line"></i><span>داشبورد</span></a>
        <a href="./products.html" class="admin-nav-item is-active"><i class="ri-book-2-line"></i><span>محصولات</span><span class="admin-nav-badge">۲,۴۰۰</span></a>
        <a href="./orders.html" class="admin-nav-item"><i class="ri-shopping-bag-3-line"></i><span>سفارش‌ها</span><span class="admin-nav-badge admin-nav-badge--alert">۱۲</span></a>
        <a href="./users.html" class="admin-nav-item"><i class="ri-user-3-line"></i><span>کاربران</span></a>

        <p class="admin-nav-title">محتوا</p>
        <a href="#" class="admin-nav-item"><i class="ri-article-line"></i><span>مجله</span></a>
        <a href="#" class="admin-nav-item"><i class="ri-price-tag-3-line"></i><span>دسته‌بندی‌ها</span></a>
        <a href="#" class="admin-nav-item"><i class="ri-chat-3-line"></i><span>نظرات</span><span class="admin-nav-badge admin-nav-badge--alert">۲۴</span></a>

        <p class="admin-nav-title">سیستم</p>
        <a href="./settings.html" class="admin-nav-item"><i class="ri-settings-3-line"></i><span>تنظیمات</span></a>
        <a href="../../index.html" class="admin-nav-item"><i class="ri-logout-box-r-line"></i><span>خروج</span></a>
      </nav>

      <div class="admin-sidebar-footer">
        <div class="flex items-center gap-2.5">
          <div class="grid h-[38px] w-[38px] place-items-center rounded-full bg-gradient-to-br from-[#87927a] to-[#3b4a3f] text-[12px] font-black text-white">م.ر</div>
          <div class="min-w-0 flex-1">
            <b class="block truncate text-[11px] font-black text-white">مریم رضایی</b>
            <small class="mt-0.5 block text-[9px] text-white/50">مدیر سیستم</small>
          </div>
        </div>
      </div>
    </aside>

    <div id="adminOverlay" class="fixed inset-0 z-[55] hidden bg-black/40 backdrop-blur-sm lg:hidden" data-admin-close></div>

    <div class="admin-main">

      <header class="admin-topbar">
        <button class="icon-btn lg:hidden" data-admin-open><i class="ri-menu-4-line"></i></button>
        <div class="hidden flex-1 lg:block">
          <div class="search-box !h-[40px] !max-w-[380px]">
            <i class="ri-search-2-line"></i>
            <input type="search" placeholder="جست‌وجوی محصول...">
            <kbd>⌘K</kbd>
          </div>
        </div>
        <div class="mr-auto flex items-center gap-2">
          <button class="admin-icon-btn"><i class="ri-notification-3-line"></i><span class="admin-dot"></span></button>
          <a href="../../index.html" class="admin-icon-btn"><i class="ri-external-link-line"></i></a>
        </div>
      </header>

      <main class="admin-content">

        <div class="mb-6 flex flex-col items-start justify-between gap-4 sm:flex-row sm:items-end">
          <div>
            <nav class="flex items-center gap-2 text-[10px] text-muted">
              <span>پنل مدیریت</span>
              <i class="ri-arrow-left-s-line"></i>
              <span class="text-ink font-bold">محصولات</span>
            </nav>
            <h1 class="mt-2 text-[clamp(20px,3vw,26px)] font-black tracking-[-.03em]">مدیریت محصولات</h1>
            <p class="mt-1 text-[11px] text-muted">۲,۴۰۰ محصول در ۱۲ دسته‌بندی</p>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <button class="admin-btn"><i class="ri-filter-3-line"></i> فیلتر</button>
            <button class="admin-btn"><i class="ri-download-2-line"></i> خروجی</button>
            <button class="admin-btn admin-btn--primary"><i class="ri-add-line"></i> محصول جدید</button>
          </div>
        </div>

        <div class="admin-card">
          <div class="admin-card-head">
            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center gap-1.5 rounded-[11px] border border-border bg-white p-1 text-[10px]">
                <button class="chart-tab is-active">همه</button>
                <button class="chart-tab">موجود</button>
                <button class="chart-tab">ناموجود</button>
                <button class="chart-tab">تخفیف‌دار</button>
              </div>
            </div>
            <span class="text-[11px] text-muted">۱۲ از ۲,۴۰۰ نمایش داده می‌شود</span>
          </div>

          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th><input type="checkbox" class="admin-checkbox"></th>
                  <th>محصول</th>
                  <th>دسته</th>
                  <th>قیمت</th>
                  <th>موجودی</th>
                  <th>وضعیت</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="productsTableBody">
                <!-- JS از admin.js داخل همین فایل -->
              </tbody>
            </table>
          </div>

          <div class="mt-4 flex items-center justify-between">
            <span class="text-[11px] text-muted">صفحه ۱ از ۲۰۰</span>
            <div class="flex items-center gap-1">
              <button class="admin-pagination">قبلی</button>
              <button class="admin-pagination is-active">۱</button>
              <button class="admin-pagination">۲</button>
              <button class="admin-pagination">۳</button>
              <button class="admin-pagination">بعدی</button>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/src/js/admin.js"></script>
</body>
</html>
